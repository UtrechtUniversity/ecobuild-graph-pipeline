# Production never runs a local Ollama, same as dev (see
# docker-compose.remote-ollama.yml) — it just reaches the shared Ollama
# server directly at OLLAMA_HOST (131.211.44.88:11434), with no SSH tunnel
# and no network_mode: host, since a routable IP needs neither.
services:
  ollama: !reset null

  knowledge-extraction:
    depends_on: !override
      document-db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
