# orchestration/docker-compose.yml

services:
  document-db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Bound to loopback only: `make dev` needs this reachable from the host
      # (native backend/crawlers connect via localhost:5433, see their
      # .env's DB_HOST/DB_PORT), but it has no business being reachable from
      # outside the box, especially once this same file is used for `make deploy`.
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../microservices/document-database/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s # Give PostgreSQL time to initialize its database

  neo4j:
    image: neo4j:5.20
    hostname: neo4j
    restart: always
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: 'true'
      NEO4J_apoc_import_file_enabled: 'true'
      NEO4J_apoc_import_file_use__neo4j__config: 'true'
    ports:
      # Loopback-only: convenience for opening Neo4j Browser / bolt from the
      # host during dev. knowledge-extraction reaches this over the compose
      # network by service name regardless, so nothing needs it published.
      - "127.0.0.1:7474:7474" # Browser UI
      - "127.0.0.1:7687:7687" # Bolt protocol
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "neo4j-admin server status || exit 1" ]
      interval: 2s
      timeout: 2s
      retries: 5
      start_period: 10s

  crawler:
    # No profiles: runs by default as a long-lived service, started/stopped via
    # the api-backend's /crawlers/semantic_scholar/* endpoints instead of a one-shot batch job.
    build:
      context: ../microservices/paper-crawler
      dockerfile: Dockerfile
    depends_on:
      document-db:
        condition: service_healthy # Crawler depends on document-db being healthy
    environment:
      DB_HOST: document-db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      SS_API_KEY: ${SS_API_KEY}
    # Not published: only used via the Docker network (api-backend calls it
    # as http://crawler:8000). Never runs in `make dev` either — that target
    # runs this natively via poetry instead. See microservices/paper-crawler/Makefile.
    # Note: If crawler's internal code also makes requests to other services,
    # it can still use their service names (e.g., http://api-backend:8000) inside the Docker network.
    healthcheck:
      test: [ "CMD", "poetry", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  scopus-crawler:
    # Same shape as `crawler`, second independent source — started/stopped via
    # the api-backend's /crawlers/scopus/* endpoints.
    build:
      context: ../microservices/scopus-crawler
      dockerfile: Dockerfile
    depends_on:
      document-db:
        condition: service_healthy
    environment:
      DB_HOST: document-db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      SCOPUS_API_KEY: ${SCOPUS_API_KEY}
      SCOPUS_INSTTOKEN: ${SCOPUS_INSTTOKEN}
    # Not published: only reached via the Docker network (api-backend calls
    # it as http://scopus-crawler:8000). Never runs in `make dev` either.
    healthcheck:
      test: [ "CMD", "poetry", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Dedicated profile, separate from "extract": neither `make dev`/`make extract`
  # nor `make deploy` ever wants a local Ollama (both point OLLAMA_HOST at the
  # shared server at 131.211.44.88:11434 instead — see .env.template and
  # docker-compose.remote-ollama.yml). This service exists only as an opt-in
  # escape hatch (`--profile local-ollama`) for running fully offline.
  ollama:
    profiles: [ "local-ollama" ]
    image: ollama/ollama:latest
    container_name: orchestration-ollama-1
    ports:
      # Loopback-only: convenience for pulling/managing models by hand.
      # knowledge-extraction reaches it over the compose network regardless.
      - "127.0.0.1:11434:11434"
    volumes:
      - ~/.ollama:/root/.ollama
    healthcheck:
      # Added healthcheck for consistency and reliability
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  knowledge-extraction:
    profiles: [ "extract" ]
    build:
      context: ../microservices/knowledge-extraction
      dockerfile: Dockerfile
    depends_on:
      document-db:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      # Not ollama: it's opt-in only (see the ollama service above), reached
      # via OLLAMA_HOST regardless of whether it's the local container or
      # the shared 131.211.44.88 server.
    environment:
      DB_HOST: document-db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_HOST: ${OLLAMA_HOST}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL}
    ports:
      # Loopback-only: convenience for curling /extract directly during dev.
      # api-backend reaches it over the compose network regardless.
      - "127.0.0.1:8002:8001"
    volumes:
      # Added for checking local pdfs and getting preprocessed results
      - ../microservices/knowledge-extraction/test_papers:/app/test_papers
      # Persist vocabulary embedding cache across restarts
      - knowledge-extraction-cache:/app/.cache
    # Pull the configured models before serving; the extraction API itself
    # is the Dockerfile's default ENTRYPOINT (uvicorn src.service:app).
    entrypoint: [ "/bin/sh", "-c", "python /app/scripts/pull_model.py && poetry run uvicorn src.service:app --host 0.0.0.0 --port 8001 --no-access-log" ]
    healthcheck:
      test: [ "CMD", "poetry", "run", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # NEW SERVICE: FastAPI Backend
  api-backend:
    # Renamed to 'api-backend' for clarity (distinguishes from 'backend' directory)
    build:
      context: ../microservices/backend # Path to your FastAPI backend directory
      dockerfile: Dockerfile # Name of the Dockerfile in that directory
    # No profiles, so it runs by default
    # Not published to the host: reached instead over the ecobuild-edge
    # network by the existing ecobuild-caddy-1 (see orchestration/Caddyfile.snippet).
    # `make dev` runs the backend natively instead (see microservices/backend/Makefile).
    networks:
      - default
      - ecobuild-edge
    volumes:
      # Downloaded/uploaded PDFs (main.py's PAPERS_DIR/MANUAL_DIR) — without
      # this they live in the container's writable layer and vanish on every
      # `make deploy` rebuild.
      - paper-pdfs:/app/downloaded_papers
      - paper-manual-uploads:/app/manual_uploads
    depends_on:
      document-db:
        condition: service_healthy
    environment:
      SS_CRAWLER_URL: http://crawler:8000
      SCOPUS_CRAWLER_URL: http://scopus-crawler:8000
      EXTRACTION_URL: http://knowledge-extraction:8001
      DB_HOST: document-db
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_PORT: 5432
      # Read-only connection to the metastudy DS->ES knowledge graph (external, see .env.template)
      META_NEO4J_URI: ${META_NEO4J_URI}
      META_NEO4J_USER: ${META_NEO4J_USER}
      META_NEO4J_PASSWORD: ${META_NEO4J_PASSWORD}
      META_NEO4J_DATABASE: ${META_NEO4J_DATABASE}
      # Optional egress proxy for download_pdf() — see .env.template. Blank
      # HTTPS_PROXY/HTTP_PROXY are no-ops; urllib only proxies when set.
      HTTPS_PROXY: ${HTTPS_PROXY}
      HTTP_PROXY: ${HTTP_PROXY}
      NO_PROXY: ${NO_PROXY}
    healthcheck:
      test: [ "CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/status')" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 120s

  # NEW SERVICE: Frontend (React/Bun)
  frontend:
    build:
      context: ../frontend # Path to your frontend directory
      dockerfile: Dockerfile # Name of the Dockerfile in that directory
    # No profiles, so it runs by default
    # Not published to the host: reached instead over the ecobuild-edge
    # network by the existing ecobuild-caddy-1 (see orchestration/Caddyfile.snippet).
    # `make dev` runs the frontend natively instead (see frontend/Makefile).
    networks:
      - default
      - ecobuild-edge
    environment:
      # Baked into index.html by frontend/entrypoint.sh at container start;
      # see orchestration/.env.template.
      API_BASE: ${API_BASE}
      BASE_PATH: ${BASE_PATH}
    depends_on:
      api-backend:
        # Frontend depends on backend API being available
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/" ] # Basic health check for Nginx
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

volumes:
  pgdata:
  neo4j_data:
  knowledge-extraction-cache:
  paper-pdfs:
  paper-manual-uploads:

networks:
  # Shared with the existing ecobuild-caddy-1 stack already running on this
  # host, so it can reverse_proxy to frontend/api-backend by name instead of
  # us publishing them to the host. One-time setup on the deploy host:
  #   docker network create ecobuild-edge
  # ...then add `ecobuild-edge` to ecobuild-caddy-1's own compose file too
  # (see orchestration/Caddyfile.snippet).
  ecobuild-edge:
    external: true
